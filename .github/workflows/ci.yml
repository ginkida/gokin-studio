name: CI

# Fast checks: backend tests + frontend type-check/build. Runs on PR + push
# to main so regressions land visibly. Cross-platform binary builds are
# only done on tag push (see release.yml).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # WebKit + GTK headers are referenced by Wails packages but Go test
      # runs of `internal/...` don't need a UI binary — pure unit tests.
      # Install anyway because some engine packages cgo-link against them.
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Run studio + engine tests
        run: go test -count=1 ./internal/...

      - name: Run with race detector (studio only)
        run: go test -race -count=1 ./internal/studio/...

      - name: Coverage
        run: |
          go test -coverprofile=coverage.out ./internal/studio/...
          go tool cover -func=coverage.out | tail -1

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # `wails generate module` produces frontend/wailsjs/ — JS+TS bindings
      # for all `Studio` Wails-exposed methods. The folder is gitignored
      # because it's purely generated, so CI must produce it before TypeScript
      # can resolve `../wailsjs/go/studio/Studio` imports from App.tsx.
      - name: Install Wails CLI + generate bindings
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          # main.go has //go:embed all:frontend/dist — wails generate
          # parses the binary spec which fails if the dir is empty. Plant
          # a stub so the embed resolves; the real `npm run build` later
          # overwrites it with the production bundle.
          mkdir -p frontend/dist
          touch frontend/dist/index.html
          wails generate module

      - name: Install frontend deps
        working-directory: frontend
        # Using `npm install` (not `npm ci`) because optional WASM deps
        # (@emnapi/*) are platform-conditional — a lock generated on macOS
        # lacks Linux-only opt deps, and vice versa. `npm install` is
        # forgiving and reconciles; `npm ci` errors out. The release
        # workflow uses `wails build` which internally also calls
        # `npm install`, so behavior stays consistent.
        run: npm install --no-audit --no-fund

      # tsc + vite build catches type errors AND ensures the iter 910+
      # bundle splitting still keeps chunks under the size warning cap.
      - name: Type-check + build
        working-directory: frontend
        run: npm run build

  vet:
    name: go vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      # Generate Wails JS/TS bindings (used by App.tsx, gitignored, so CI
      # produces them fresh). Required before npm build because TypeScript
      # imports `../wailsjs/go/studio/Studio`.
      - name: Install Wails CLI + generate bindings
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          # main.go has //go:embed all:frontend/dist — wails generate
          # parses the binary spec which fails if the dir is empty. Plant
          # a stub so the embed resolves; the real `npm run build` later
          # overwrites it with the production bundle.
          mkdir -p frontend/dist
          touch frontend/dist/index.html
          wails generate module

      # main.go has //go:embed all:frontend/dist; go vet checks it. Build
      # frontend first so the embed target exists.
      - name: Build frontend
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: go vet
        # webkit2_41 build tag matches what release.yml uses on Linux.
        run: go vet -tags webkit2_41 ./...
