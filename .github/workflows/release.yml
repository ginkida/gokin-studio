name: Release

# Triggered by pushing a version tag like v1.0.0. Builds a binary on each
# of macOS / Windows / Linux and attaches the artifacts to a GitHub Release.
# Manual dispatch is also allowed for testing — set the tag input to a
# pre-existing tag, the workflow will rebuild + re-upload.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to re-release (e.g. v1.0.0)'
        required: true

permissions:
  contents: write # required to create the Release + upload artifacts

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve and verify release version
        id: tag
        shell: bash
        env:
          MANUAL_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="$MANUAL_TAG"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          app_version="$(sed -n 's/^const Version = "\([^"]*\)"$/\1/p' internal/studio/diagnostics.go)"
          if [ -z "$app_version" ] || [ "$tag" != "v$app_version" ]; then
            echo "Release tag $tag does not match application version v$app_version" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            artifact-name: gokin-studio-macos-universal.zip
            artifact-source: build/bin/gokin-studio.app
            build-tags: ''
          - os: ubuntu-latest
            platform: linux/amd64
            artifact-name: gokin-studio-linux-amd64.tar.gz
            artifact-source: build/bin/gokin-studio
            # Ubuntu 24.04 runners ship libwebkit2gtk-4.1, not 4.0 (which
            # Wails defaults to). The webkit2_41 build tag tells Wails to
            # link against the 4.1 series.
            build-tags: 'webkit2_41'
          - os: windows-latest
            platform: windows/amd64
            artifact-name: gokin-studio-windows-amd64.zip
            artifact-source: build/bin/gokin-studio.exe
            build-tags: ''

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Wails on Linux needs GTK + WebKit2GTK system libraries to compile
      # against. macOS/Windows runners have everything in the SDK already.
      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      # Note: backend tests run in ci.yml on every push to main and on every
      # PR. We deliberately don't re-run them here — the release path stays
      # simple, and the cross-platform tests that pass locally on macOS/Linux
      # have known issues on Windows (path separators, git PATH) that aren't
      # release blockers. Validation responsibility lives in CI.

      - name: Build app
        run: wails build -platform ${{ matrix.platform }} -clean ${{ matrix.build-tags && format('-tags {0}', matrix.build-tags) || '' }}

      # Package per-platform. macOS gets a .zip of the .app bundle (DMG
      # would require code-signing infrastructure we don't have). Linux
      # gets a tar.gz of the standalone binary. Windows gets a .zip of
      # the .exe (NSIS installer is available via `wails build -nsis`
      # if/when we have a signing cert).
      - name: Package macOS
        if: matrix.os == 'macos-latest'
        run: |
          cd build/bin
          zip -r -q ../../${{ matrix.artifact-name }} gokin-studio.app

      - name: Package Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd build/bin
          tar -czf ../../${{ matrix.artifact-name }} gokin-studio

      - name: Package Windows
        if: matrix.os == 'windows-latest'
        run: |
          cd build/bin
          Compress-Archive -Path gokin-studio.exe -DestinationPath ../../${{ matrix.artifact-name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-name }}
          retention-days: 7

  release:
    needs: [metadata, build]
    runs-on: ubuntu-latest
    name: Publish Release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum gokin-studio-* > SHA256SUMS.txt

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          name: ${{ needs.metadata.outputs.tag }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
